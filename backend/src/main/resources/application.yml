server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
spring:
  application:
    name: texto-em-dados-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/textoemdados}
    username: ${DATABASE_USER:textoemdados}
    password: ${DATABASE_PASSWORD:development-only}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  cors-origins: ${APP_CORS_ORIGINS:http://localhost:3000}
  jwt-secret: ${JWT_SECRET:}
  access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
  refresh-token-days: ${REFRESH_TOKEN_DAYS:14}
  secure-cookies: ${SECURE_COOKIES:false}
  mail-from: ${MAIL_FROM:no-reply@localhost}
  nlp-service-url: ${NLP_SERVICE_URL:http://localhost:8000}
springdoc:
  swagger-ui:
    path: /docs
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
