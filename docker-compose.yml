services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-textoemdados}
      POSTGRES_USER: ${DATABASE_USER:-textoemdados}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Configure DATABASE_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  nlp-service:
    build: ./nlp-service
    expose:
      - "8000"
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${DATABASE_NAME:-textoemdados}
      DATABASE_USER: ${DATABASE_USER:-textoemdados}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Configure DATABASE_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET in .env}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:3000}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@localhost}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      NLP_SERVICE_URL: http://nlp-service:8000
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      nlp-service:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  postgres-data:
